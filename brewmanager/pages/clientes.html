<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewManager — Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg navbar-brew">
    <div class="container">
      <a class="navbar-brand" href="../pagina.html">
        <i class="bi bi-cup-hot-fill me-2"></i>BrewManager
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="../pagina.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="clientes.html"><i class="bi bi-people me-1"></i>Clientes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="productos.html"><i class="bi bi-bag me-1"></i>Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="pedidos.html"><i class="bi bi-receipt me-1"></i>Pedidos</a>
          </li>
          <li class="nav-item ms-lg-3">
            <a class="nav-link" href="login.html"><i class="bi bi-box-arrow-right me-1"></i>Salir</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== CONTENIDO ===== -->
  <main class="container py-4">

    <!-- Cabecera de sección -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h2 class="section-title mb-0"><i class="bi bi-people me-2"></i>Clientes</h2>
      <a href="cliente-form.html" class="btn btn-brew-primary">
        <i class="bi bi-person-plus me-1"></i>Nuevo Cliente
      </a>
    </div>

    <!-- Buscador -->
    <div class="mb-3">
      <input
        type="text"
        id="buscador-cliente"
        class="form-control buscador-brew"
        placeholder="Buscar por nombres, apellidos o identificación..."
        oninput="buscarCliente()"
      />
    </div>

    <!-- Tabla de clientes -->
    <div class="table-responsive">
      <table class="table table-brew table-bordered table-hover">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombres</th>
            <th>Apellidos</th>
            <th>Identificación</th>
            <th>Teléfono</th>
            <th>Celular</th>
            <th>Correo</th>
            <th>Est. Civil</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody-clientes">
          <!-- Llenado dinámicamente por clientes.js -->
        </tbody>
      </table>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <p class="mb-0">&copy; 2024 BrewManager — Sistema de Gestión de Bar-Café</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Cargar datos primero, luego los módulos -->
  <script src="../js/api.js"></script>
  <script src="../js/clientes.js"></script>
  <script>
    // Inicializar la tabla al cargar la página
    cargarTablaClientes();
  </script>

</body>
</html>
