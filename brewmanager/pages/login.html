<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewManager — Iniciar Sesión</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Estilos personalizados (ruta relativa desde pages/) -->
  <link rel="stylesheet" href="../css/estilos.css" />
  <style>
    /* Fondo degradado para la página de login */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, #4b3621 0%, #a67b5b 60%, #f5f5dc 100%);
    }
  </style>
</head>
<body>

  <!-- ===== FORMULARIO DE LOGIN ===== -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-5 col-lg-4">

        <!-- Tarjeta de login -->
        <div class="card login-card">

          <!-- Encabezado -->
          <div class="login-header">
            <i class="bi bi-cup-hot-fill fs-1 mb-2 d-block"></i>
            <h2>BrewManager</h2>
            <p class="mb-0 small opacity-75">Sistema de Gestión de Bar-Café</p>
          </div>

          <!-- Cuerpo del formulario -->
          <div class="card-body p-4">
            <h5 class="card-title text-center mb-4" style="color: var(--cafe-oscuro);">Iniciar Sesión</h5>

            <!-- Mensaje de error general -->
            <div id="error-login" class="alert alert-danger d-none" role="alert">
              <i class="bi bi-exclamation-triangle me-2"></i>Usuario o contraseña incorrectos.
            </div>

            <form id="form-login" novalidate>

              <!-- Campo: usuario -->
              <div class="mb-3">
                <label for="usuario" class="form-label fw-semibold" style="color: var(--cafe-oscuro);">
                  <i class="bi bi-person me-1"></i>Usuario
                </label>
                <input
                  type="text"
                  id="usuario"
                  class="form-control"
                  placeholder="Ingrese su usuario"
                  autocomplete="username"
                />
                <!-- Mensaje de error del campo -->
                <div id="usuario-error" class="error-msg" style="color:#dc3545; font-size:0.85rem; display:none;">
                  El usuario es obligatorio.
                </div>
              </div>

              <!-- Campo: contraseña -->
              <div class="mb-4">
                <label for="contrasena" class="form-label fw-semibold" style="color: var(--cafe-oscuro);">
                  <i class="bi bi-lock me-1"></i>Contraseña
                </label>
                <div class="input-group">
                  <input
                    type="password"
                    id="contrasena"
                    class="form-control"
                    placeholder="Ingrese su contraseña"
                    autocomplete="current-password"
                  />
                  <!-- Botón para mostrar/ocultar contraseña -->
                  <button class="btn btn-outline-secondary" type="button" id="btn-ver-pass" title="Mostrar/ocultar contraseña">
                    <i class="bi bi-eye" id="icono-pass"></i>
                  </button>
                </div>
                <div id="contrasena-error" class="error-msg" style="color:#dc3545; font-size:0.85rem; display:none;">
                  La contraseña es obligatoria.
                </div>
              </div>

              <!-- Botón de submit -->
              <button type="submit" class="btn btn-brew-primary w-100 py-2 fs-5">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
              </button>

            </form>

            <p class="text-center text-muted mt-3 small">
              <i class="bi bi-info-circle me-1"></i>Usuario: <strong>admin</strong> / Clave: <strong>1234</strong>
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ===== MOSTRAR / OCULTAR CONTRASEÑA =====
    document.getElementById("btn-ver-pass").addEventListener("click", function() {
      var input = document.getElementById("contrasena");
      var icono = document.getElementById("icono-pass");
      if (input.type === "password") {
        input.type = "text";
        icono.className = "bi bi-eye-slash";
      } else {
        input.type = "password";
        icono.className = "bi bi-eye";
      }
    });

    // ===== VALIDACIÓN Y LÓGICA DE LOGIN =====
    document.getElementById("form-login").addEventListener("submit", function(e) {
      e.preventDefault();

      var usuario = document.getElementById("usuario");
      var contrasena = document.getElementById("contrasena");
      var errorLogin = document.getElementById("error-login");
      var valido = true;

      // Ocultar error general
      errorLogin.classList.add("d-none");

      // Validar campo usuario
      if (!usuario.value.trim()) {
        document.getElementById("usuario-error").style.display = "block";
        usuario.classList.add("is-invalid");
        valido = false;
      } else {
        document.getElementById("usuario-error").style.display = "none";
        usuario.classList.remove("is-invalid");
      }

      // Validar campo contraseña
      if (!contrasena.value.trim()) {
        document.getElementById("contrasena-error").style.display = "block";
        contrasena.classList.add("is-invalid");
        valido = false;
      } else {
        document.getElementById("contrasena-error").style.display = "none";
        contrasena.classList.remove("is-invalid");
      }

      // Si pasa validación, verificar credenciales
      if (valido) {
        // Credenciales correctas: admin / 1234
        if (usuario.value.trim() === "admin" && contrasena.value === "1234") {
          // Redirigir al dashboard (pagina.html está un nivel arriba)
          alert("¡Bienvenido, Administrador!");
          window.location.href = "../pagina.html";
        } else {
          // Mostrar error de credenciales incorrectas
          errorLogin.classList.remove("d-none");
          usuario.classList.add("is-invalid");
          contrasena.classList.add("is-invalid");
        }
      }
    });

    // Limpiar errores al escribir en los campos
    document.getElementById("usuario").addEventListener("input", function() {
      this.classList.remove("is-invalid");
      document.getElementById("usuario-error").style.display = "none";
      document.getElementById("error-login").classList.add("d-none");
    });
    document.getElementById("contrasena").addEventListener("input", function() {
      this.classList.remove("is-invalid");
      document.getElementById("contrasena-error").style.display = "none";
      document.getElementById("error-login").classList.add("d-none");
    });
  </script>

</body>
</html>
