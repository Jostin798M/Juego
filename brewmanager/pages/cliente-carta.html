<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewManager — Nuestra Carta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
  <style>
    .carta-item { cursor: pointer; transition: box-shadow .2s; border: 2px solid transparent; }
    .carta-item:hover { box-shadow: 0 4px 12px rgba(75,54,33,.2); border-color: var(--cafe-claro); }
    .pedido-flotante {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--cafe-oscuro); color: #fff;
      padding: 1rem; z-index: 1000;
    }
  </style>
</head>
<body style="padding-bottom: 100px;">

  <nav class="navbar navbar-expand-lg navbar-brew">
    <div class="container">
      <a class="navbar-brand" href="cliente-carta.html"><i class="bi bi-cup-hot-fill me-2"></i>BrewManager</a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="text-center mb-4">
      <h2 class="section-title"><i class="bi bi-book me-2"></i>Nuestra Carta</h2>
      <p class="text-muted">Selecciona los productos y confirma tu pedido</p>
    </div>

    <!-- Número de mesa -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <label for="c-mesa" class="form-label fw-bold" style="color:var(--cafe-oscuro);">
          <i class="bi bi-grid me-1"></i>¿En qué mesa estás?
        </label>
        <input type="number" id="c-mesa" class="form-control" placeholder="Ingresa el número de tu mesa" min="1" style="max-width:200px;" />
      </div>
    </div>

    <!-- Carta de productos -->
    <div id="carta-contenido"><!-- Llenado por JS --></div>
  </main>

  <!-- Barra flotante de pedido -->
  <div class="pedido-flotante">
    <div class="container d-flex justify-content-between align-items-center gap-3 flex-wrap">
      <div>
        <span id="cliente-items" class="me-3">0 producto(s)</span>
        <strong id="cliente-total">$0.00</strong>
      </div>
      <button id="btn-confirmar-pedido" class="btn btn-brew-secondary px-4" disabled onclick="confirmarPedidoCliente()">
        <i class="bi bi-check-circle me-1"></i>Confirmar Pedido
      </button>
    </div>
  </div>

  <footer><p class="mb-0">&copy; 2024 BrewManager</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/cliente-publico.js"></script>
  <script>renderCartaCliente();</script>
</body>
</html>
