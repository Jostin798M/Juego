<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewManager — Detalle Pedido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg navbar-brew">
    <div class="container">
      <a class="navbar-brand" href="../pagina.html"><i class="bi bi-cup-hot-fill me-2"></i>BrewManager</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../pagina.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="clientes.html"><i class="bi bi-people me-1"></i>Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html"><i class="bi bi-bag me-1"></i>Productos</a></li>
          <li class="nav-item"><a class="nav-link active" href="pedidos.html"><i class="bi bi-receipt me-1"></i>Pedidos</a></li>
          <li class="nav-item ms-lg-3"><a class="nav-link" href="../index.html"><i class="bi bi-box-arrow-right me-1"></i>Salir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== CONTENIDO ===== -->
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h2 class="section-title mb-0"><i class="bi bi-receipt me-2"></i>Detalle del Pedido</h2>
          <a href="pedidos.html" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Volver
          </a>
        </div>

        <div id="contenido-pedido">
          <div class="card shadow-sm">
            <div class="card-body p-4">

              <!-- Estado del pedido -->
              <div class="text-center mb-4">
                <span id="det-estado" class="badge badge-pendiente fs-6">Pendiente</span>
              </div>

              <!-- Info general -->
              <table class="table table-borderless mb-3">
                <tbody>
                  <tr>
                    <td class="detalle-label"><i class="bi bi-person me-2"></i>Cliente / Mesa</td>
                    <td id="det-origen" class="detalle-valor fw-bold">—</td>
                  </tr>
                  <tr>
                    <td class="detalle-label"><i class="bi bi-calendar me-2"></i>Fecha y Hora</td>
                    <td id="det-fecha" class="detalle-valor">—</td>
                  </tr>
                </tbody>
              </table>

              <!-- Lista de productos -->
              <h6 class="mb-2" style="color: var(--cafe-oscuro);">
                <i class="bi bi-bag me-1"></i>Productos del Pedido
              </h6>
              <ul class="list-group mb-3" id="det-productos">
                <!-- Llenado por JS -->
              </ul>

              <!-- Total -->
              <div class="total-pedido-box mb-4">
                Total: <span id="det-total">$0.00</span>
              </div>

              <!-- Botones de acción -->
              <div class="d-flex gap-2">
                <button id="btn-estado-pedido" class="btn btn-brew-secondary">
                  <i class="bi bi-arrow-repeat me-1"></i>Cambiar Estado
                </button>
                <a href="pedidos.html" class="btn btn-outline-secondary">
                  <i class="bi bi-list me-1"></i>Ver Todos
                </a>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer>
    <p class="mb-0">&copy; 2024 BrewManager</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/pedidos.js"></script>
  <script>
    cargarDetallePedido();
  </script>

</body>
</html>
