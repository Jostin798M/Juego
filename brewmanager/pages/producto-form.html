<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewManager — Formulario Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg navbar-brew">
    <div class="container">
      <a class="navbar-brand" href="../pagina.html"><i class="bi bi-cup-hot-fill me-2"></i>BrewManager</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../pagina.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="clientes.html"><i class="bi bi-people me-1"></i>Clientes</a></li>
          <li class="nav-item"><a class="nav-link active" href="productos.html"><i class="bi bi-bag me-1"></i>Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="pedidos.html"><i class="bi bi-receipt me-1"></i>Pedidos</a></li>
          <li class="nav-item ms-lg-3"><a class="nav-link" href="login.html"><i class="bi bi-box-arrow-right me-1"></i>Salir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== CONTENIDO ===== -->
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-6">

        <h2 class="section-title" id="form-titulo">Nuevo Producto</h2>

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <form id="form-producto" class="form-brew" novalidate onsubmit="guardarProducto(event)">

              <!-- Nombre -->
              <div class="mb-3">
                <label for="f-nombre" class="form-label">Nombre del Producto <span class="text-danger">*</span></label>
                <input type="text" id="f-nombre" class="form-control" placeholder="Ej: Café Americano" />
                <div id="f-nombre-error" class="error-msg" style="color:#dc3545;font-size:0.85rem;display:none;">
                  El nombre es obligatorio.
                </div>
              </div>

              <!-- Descripción (opcional) -->
              <div class="mb-3">
                <label for="f-descripcion" class="form-label">Descripción <span class="text-muted small">(opcional)</span></label>
                <textarea id="f-descripcion" class="form-control" rows="2" placeholder="Descripción breve del producto..."></textarea>
              </div>

              <!-- Categoría -->
              <div class="mb-3">
                <label for="f-categoria" class="form-label">Categoría <span class="text-danger">*</span></label>
                <select id="f-categoria" class="form-select">
                  <option value="">-- Seleccione --</option>
                  <option value="Bebidas Calientes">Bebidas Calientes</option>
                  <option value="Bebidas Frías">Bebidas Frías</option>
                  <option value="Snacks">Snacks</option>
                </select>
                <div id="f-categoria-error" class="error-msg" style="color:#dc3545;font-size:0.85rem;display:none;">
                  Seleccione una categoría.
                </div>
              </div>

              <!-- Precio -->
              <div class="mb-3">
                <label for="f-precio" class="form-label">Precio ($) <span class="text-danger">*</span></label>
                <input type="number" id="f-precio" class="form-control" placeholder="Ej: 2.50" min="0.01" step="0.01" />
                <div id="f-precio-error" class="error-msg" style="color:#dc3545;font-size:0.85rem;display:none;">
                  Ingrese un precio válido mayor a 0.
                </div>
              </div>

              <!-- Disponible -->
              <div class="mb-4">
                <label for="f-disponible" class="form-label">Disponible <span class="text-danger">*</span></label>
                <select id="f-disponible" class="form-select">
                  <option value="">-- Seleccione --</option>
                  <option value="true">Sí — Disponible</option>
                  <option value="false">No — No disponible</option>
                </select>
                <div id="f-disponible-error" class="error-msg" style="color:#dc3545;font-size:0.85rem;display:none;">
                  Seleccione la disponibilidad.
                </div>
              </div>

              <!-- Botones -->
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-brew-primary px-4">
                  <i class="bi bi-save me-1"></i>Guardar
                </button>
                <a href="productos.html" class="btn btn-outline-secondary px-4">
                  <i class="bi bi-x-circle me-1"></i>Cancelar
                </a>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer>
    <p class="mb-0">&copy; 2024 BrewManager</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/productos.js"></script>
  <script>
    cargarFormProducto();
  </script>

</body>
</html>
