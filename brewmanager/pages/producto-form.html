<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrewManager | Formulario Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-brew">
    <div class="container">
      <a class="navbar-brand" href="../pagina.html">☕ BrewManager</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../pagina.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
          <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4" style="max-width:600px;">
    <h3 class="section-title" id="tituloFormulario">Registrar Nuevo Producto</h3>

    <div class="card p-4 shadow-sm form-brew">
      <div class="row g-3">

        <!-- Nombre -->
        <div class="col-12">
          <label class="form-label">Nombre <span class="text-danger">*</span></label>
          <input type="text" id="nombre" class="form-control" placeholder="Ej: Cappuccino">
          <div class="error-msg" id="err-nombre">El nombre del producto es obligatorio.</div>
        </div>

        <!-- Descripción (opcional) -->
        <div class="col-12">
          <label class="form-label">Descripción <span class="text-muted">(opcional)</span></label>
          <textarea id="descripcion" class="form-control" rows="2"
                    placeholder="Ej: Espresso con leche vaporizada y espuma"></textarea>
        </div>

        <!-- Categoría -->
        <div class="col-md-6">
          <label class="form-label">Categoría <span class="text-danger">*</span></label>
          <select id="categoria" class="form-select">
            <option value="">-- Seleccione --</option>
            <option value="Bebidas Calientes">Bebidas Calientes</option>
            <option value="Bebidas Frías">Bebidas Frías</option>
            <option value="Snacks">Snacks</option>
          </select>
          <div class="error-msg" id="err-categoria">La categoría es obligatoria.</div>
        </div>

        <!-- Precio -->
        <div class="col-md-6">
          <label class="form-label">Precio (USD) <span class="text-danger">*</span></label>
          <input type="number" id="precio" class="form-control" min="0.01" step="0.01"
                 placeholder="Ej: 2.50">
          <div class="error-msg" id="err-precio">Ingrese un precio válido mayor a 0.</div>
        </div>

        <!-- Disponible -->
        <div class="col-md-6">
          <label class="form-label">Disponible <span class="text-danger">*</span></label>
          <select id="disponible" class="form-select">
            <option value="">-- Seleccione --</option>
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
          <div class="error-msg" id="err-disponible">Debe indicar la disponibilidad.</div>
        </div>

        <!-- Botones -->
        <div class="col-12 d-flex gap-2 mt-2">
          <button class="btn btn-brew-primary px-4" onclick="guardarProducto()">💾 Guardar</button>
          <a href="productos.html" class="btn btn-outline-secondary px-4">Cancelar</a>
        </div>

      </div>
    </div>
  </div>

  <footer>
    <p class="mb-0">© 2026 BrewManager — Sistema de Gestión Bar-Café</p>
  </footer>

  <script src="../js/datos.js"></script>
  <script src="../js/productos.js"></script>
  <script>
    // Detectar modo edición
    var params = new URLSearchParams(window.location.search);
    var idEditar = params.get('id');

    if (idEditar) {
      document.getElementById('tituloFormulario').textContent = 'Editar Producto';
      var prod = productos.find(function(p) { return p.id == idEditar; });
      if (prod) {
        document.getElementById('nombre').value      = prod.nombre;
        document.getElementById('descripcion').value = prod.descripcion;
        document.getElementById('categoria').value   = prod.categoria;
        document.getElementById('precio').value      = prod.precio;
        document.getElementById('disponible').value  = prod.disponible.toString();
      }
    }

    // Valida y guarda el producto
    function guardarProducto() {
      var valido = true;
      document.querySelectorAll('.error-msg').forEach(function(e) {
        e.classList.remove('visible');
      });

      // Validar campos obligatorios
      if (!document.getElementById('nombre').value.trim()) {
        document.getElementById('err-nombre').classList.add('visible');
        valido = false;
      }
      if (!document.getElementById('categoria').value) {
        document.getElementById('err-categoria').classList.add('visible');
        valido = false;
      }
      if (!document.getElementById('disponible').value) {
        document.getElementById('err-disponible').classList.add('visible');
        valido = false;
      }

      // Validar precio
      var precio = parseFloat(document.getElementById('precio').value);
      if (isNaN(precio) || precio <= 0) {
        document.getElementById('err-precio').classList.add('visible');
        valido = false;
      }

      if (!valido) return;

      alert(idEditar ? '✅ Producto actualizado correctamente.' : '✅ Producto registrado correctamente.');
      window.location.href = 'productos.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
