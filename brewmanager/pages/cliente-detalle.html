<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewManager — Detalle Cliente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg navbar-brew">
    <div class="container">
      <a class="navbar-brand" href="../pagina.html"><i class="bi bi-cup-hot-fill me-2"></i>BrewManager</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../pagina.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="clientes.html"><i class="bi bi-people me-1"></i>Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html"><i class="bi bi-bag me-1"></i>Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="pedidos.html"><i class="bi bi-receipt me-1"></i>Pedidos</a></li>
          <li class="nav-item ms-lg-3"><a class="nav-link" href="login.html"><i class="bi bi-box-arrow-right me-1"></i>Salir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== CONTENIDO ===== -->
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-7">

        <!-- Cabecera con botones -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h2 class="section-title mb-0"><i class="bi bi-person-badge me-2"></i>Detalle del Cliente</h2>
          <a href="clientes.html" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Volver
          </a>
        </div>

        <!-- Contenido del detalle -->
        <div id="contenido-detalle">
          <div class="card shadow-sm">
            <div class="card-body p-4">

              <!-- Estado (badge) -->
              <div class="text-center mb-4">
                <span id="det-estado" class="badge badge-activo fs-6">Activo</span>
              </div>

              <!-- Datos del cliente en tabla descriptiva -->
              <table class="table table-borderless">
                <tbody>
                  <tr>
                    <td class="detalle-label"><i class="bi bi-person me-2"></i>Nombres</td>
                    <td id="det-nombres" class="detalle-valor">—</td>
                  </tr>
                  <tr>
                    <td class="detalle-label"><i class="bi bi-person me-2"></i>Apellidos</td>
                    <td id="det-apellidos" class="detalle-valor">—</td>
                  </tr>
                  <tr>
                    <td class="detalle-label"><i class="bi bi-card-text me-2"></i>Identificación</td>
                    <td id="det-identificacion" class="detalle-valor">—</td>
                  </tr>
                  <tr>
                    <td class="detalle-label"><i class="bi bi-telephone me-2"></i>Teléfono</td>
                    <td id="det-telefono" class="detalle-valor">—</td>
                  </tr>
                  <tr>
                    <td class="detalle-label"><i class="bi bi-phone me-2"></i>Celular</td>
                    <td id="det-celular" class="detalle-valor">—</td>
                  </tr>
                  <tr>
                    <td class="detalle-label"><i class="bi bi-envelope me-2"></i>Correo</td>
                    <td id="det-correo" class="detalle-valor">—</td>
                  </tr>
                  <tr>
                    <td class="detalle-label"><i class="bi bi-geo-alt me-2"></i>Dirección</td>
                    <td id="det-direccion" class="detalle-valor">—</td>
                  </tr>
                  <tr>
                    <td class="detalle-label"><i class="bi bi-heart me-2"></i>Estado Civil</td>
                    <td id="det-estadoCivil" class="detalle-valor">—</td>
                  </tr>
                  <tr>
                    <td class="detalle-label"><i class="bi bi-calendar me-2"></i>Fecha Registro</td>
                    <td id="det-fecha" class="detalle-valor">—</td>
                  </tr>
                </tbody>
              </table>

              <!-- Botones de acción -->
              <div class="d-flex gap-2 mt-3">
                <a id="btn-editar-cliente" href="#" class="btn btn-warning">
                  <i class="bi bi-pencil me-1"></i>Editar
                </a>
                <button id="btn-estado-cliente" class="btn btn-danger">
                  <i class="bi bi-toggle-off me-1"></i>Cambiar Estado
                </button>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer>
    <p class="mb-0">&copy; 2024 BrewManager</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/clientes.js"></script>
  <script>
    // Cargar el detalle del cliente al abrir la página
    cargarDetalleCliente();
  </script>

</body>
</html>
