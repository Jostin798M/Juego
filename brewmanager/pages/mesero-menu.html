<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewManager — Carta del Menú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-brew">
    <div class="container">
      <a class="navbar-brand" href="mesero-mesas.html"><i class="bi bi-cup-hot-fill me-2"></i>BrewManager</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="mesero-mesas.html"><i class="bi bi-grid me-1"></i>Mesas</a></li>
          <li class="nav-item"><a class="nav-link" href="mesero-mis-pedidos.html"><i class="bi bi-receipt me-1"></i>Mis Pedidos</a></li>
          <li class="nav-item"><a class="nav-link active" href="mesero-menu.html"><i class="bi bi-bag me-1"></i>Ver Carta</a></li>
          <li class="nav-item ms-lg-3"><a class="nav-link" href="login.html"><i class="bi bi-box-arrow-right me-1"></i>Salir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h2 class="section-title"><i class="bi bi-bag me-2"></i>Carta del Menú</h2>
    <div id="contenido-menu"><!-- Llenado por JS --></div>
  </main>

  <footer><p class="mb-0">&copy; 2024 BrewManager</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script>
    var categorias = [...new Set(productos.map(function(p) { return p.categoria; }))];
    var contenedor = document.getElementById("contenido-menu");
    categorias.forEach(function(cat) {
      var items = productos.filter(function(p) { return p.categoria === cat && p.disponible; });
      if (items.length === 0) return;
      var cards = items.map(function(p) {
        return '<div class="col-12 col-sm-6 col-lg-4">' +
          '<div class="card card-brew h-100 p-3">' +
            '<div class="d-flex justify-content-between align-items-start">' +
              '<h6 class="mb-1" style="color:var(--cafe-oscuro)">' + p.nombre + '</h6>' +
              '<span class="fw-bold text-success">$' + p.precio.toFixed(2) + '</span>' +
            '</div>' +
            '<p class="text-muted small mb-0">' + (p.descripcion || '') + '</p>' +
          '</div>' +
        '</div>';
      }).join('');
      contenedor.innerHTML += '<h5 class="section-title mt-4"><i class="bi bi-tag me-2"></i>' + cat + '</h5>' +
        '<div class="row g-3">' + cards + '</div>';
    });
  </script>
</body>
</html>
