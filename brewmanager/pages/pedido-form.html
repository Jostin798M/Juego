<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewManager — Nuevo Pedido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg navbar-brew">
    <div class="container">
      <a class="navbar-brand" href="../pagina.html"><i class="bi bi-cup-hot-fill me-2"></i>BrewManager</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../pagina.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="clientes.html"><i class="bi bi-people me-1"></i>Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html"><i class="bi bi-bag me-1"></i>Productos</a></li>
          <li class="nav-item"><a class="nav-link active" href="pedidos.html"><i class="bi bi-receipt me-1"></i>Pedidos</a></li>
          <li class="nav-item ms-lg-3"><a class="nav-link" href="login.html"><i class="bi bi-box-arrow-right me-1"></i>Salir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== CONTENIDO ===== -->
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-8">

        <h2 class="section-title">Nuevo Pedido</h2>

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <form id="form-pedido" class="form-brew" novalidate onsubmit="guardarPedido(event)">

              <!-- Tipo de pedido: cliente o mesa -->
              <div class="mb-3">
                <label for="f-tipo" class="form-label">Tipo de Pedido <span class="text-danger">*</span></label>
                <select id="f-tipo" class="form-select" onchange="toggleTipoPedido()">
                  <option value="">-- Seleccione --</option>
                  <option value="cliente">Para un cliente registrado</option>
                  <option value="mesa">Para una mesa</option>
                </select>
              </div>

              <!-- Selector de cliente (visible si tipo=cliente) -->
              <div id="bloque-cliente" class="mb-3" style="display:none;">
                <label for="f-cliente" class="form-label">Cliente <span class="text-danger">*</span></label>
                <select id="f-cliente" class="form-select">
                  <option value="">-- Seleccione un cliente --</option>
                  <!-- Llenado por JS -->
                </select>
              </div>

              <!-- Número de mesa (visible si tipo=mesa) -->
              <div id="bloque-mesa" class="mb-3" style="display:none;">
                <label for="f-mesa" class="form-label">Número de Mesa <span class="text-danger">*</span></label>
                <input type="number" id="f-mesa" class="form-control" placeholder="Ej: 5" min="1" />
              </div>

              <hr />

              <!-- Selector de productos a agregar -->
              <h5 class="mb-3" style="color: var(--cafe-oscuro);">
                <i class="bi bi-bag-plus me-2"></i>Agregar Productos
              </h5>
              <div class="row g-2 mb-3 align-items-end">
                <div class="col-12 col-sm-6">
                  <label for="f-producto" class="form-label">Producto</label>
                  <select id="f-producto" class="form-select">
                    <option value="">-- Seleccione un producto --</option>
                    <!-- Llenado por JS -->
                  </select>
                </div>
                <div class="col-6 col-sm-3">
                  <label for="f-cantidad" class="form-label">Cantidad</label>
                  <input type="number" id="f-cantidad" class="form-control" value="1" min="1" max="99" />
                </div>
                <div class="col-6 col-sm-3">
                  <button type="button" class="btn btn-brew-secondary w-100" onclick="agregarProductoAPedido()">
                    <i class="bi bi-plus-lg me-1"></i>Agregar
                  </button>
                </div>
              </div>

              <!-- Lista de productos en el pedido -->
              <div id="lista-productos-pedido" class="mb-3">
                <p class="text-muted small">No ha agregado productos.</p>
              </div>

              <!-- Total calculado -->
              <div class="total-pedido-box mb-4">
                Total: <span id="total-pedido">$0.00</span>
              </div>

              <!-- Botones -->
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-brew-primary px-4">
                  <i class="bi bi-check-circle me-1"></i>Confirmar Pedido
                </button>
                <a href="pedidos.html" class="btn btn-outline-secondary px-4">
                  <i class="bi bi-x-circle me-1"></i>Cancelar
                </a>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer>
    <p class="mb-0">&copy; 2024 BrewManager</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/pedidos.js"></script>
  <script>
    function toggleTipoPedido() {
      var tipo = document.getElementById("f-tipo").value;
      document.getElementById("bloque-cliente").style.display = tipo === "cliente" ? "block" : "none";
      document.getElementById("bloque-mesa").style.display = tipo === "mesa" ? "block" : "none";
    }
    iniciarFormPedido();
  </script>

</body>
</html>
